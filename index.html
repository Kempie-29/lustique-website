<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#9E5F58" />
    <meta
      name="description"
      content="Bridal hair & makeup artistry in Pretoria. Transparent pricing, a live estimate, and a calm, personal approach from trial to touch-up."
    />

    <!-- Icons & app manifest (derived from the Lustique Co. emblem). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/emblem.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: single request, deduped, with display=swap for text-first paint. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap"
    />

    <!-- Social defaults; per-route tags are set by the app / prerender pass. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lustique Co." />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:image" content="/assets/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Lustique Co. — Bridal hair &amp; makeup artistry in Pretoria</title>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      Lustique Co. uses JavaScript for the live estimate and enquiry form. Please
      enable it, or message us on WhatsApp at +27 67 925 3894 and we'll help you
      directly.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
